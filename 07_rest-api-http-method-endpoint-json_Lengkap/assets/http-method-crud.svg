<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect width="1000" height="430" rx="28" fill="#ffffff"/>
  <g font-family="Arial" font-weight="700">
    <text x="50" y="55" font-size="30" fill="#24466e">HTTP Method dan CRUD</text>
    <g transform="translate(55 95)">
      <rect width="200" height="90" rx="16" fill="#eef5ff" stroke="#24466e" stroke-width="3"/><text x="24" y="38" font-size="28" fill="#24466e">GET</text><text x="24" y="68" font-size="18" fill="#526273">Read data</text>
    </g>
    <g transform="translate(285 95)">
      <rect width="200" height="90" rx="16" fill="#fff6d8" stroke="#fdbf0e" stroke-width="3"/><text x="24" y="38" font-size="28" fill="#7b5900">POST</text><text x="24" y="68" font-size="18" fill="#526273">Create data</text>
    </g>
    <g transform="translate(515 95)">
      <rect width="200" height="90" rx="16" fill="#e8f7ef" stroke="#0f7a48" stroke-width="3"/><text x="24" y="38" font-size="28" fill="#0f7a48">PUT</text><text x="24" y="68" font-size="18" fill="#526273">Update data</text>
    </g>
    <g transform="translate(745 95)">
      <rect width="200" height="90" rx="16" fill="#fdebed" stroke="#a41d1f" stroke-width="3"/><text x="24" y="38" font-size="28" fill="#a41d1f">DELETE</text><text x="24" y="68" font-size="18" fill="#526273">Delete data</text>
    </g>
    <text x="60" y="250" font-size="22" fill="#202631">Contoh Resource:</text>
    <rect x="55" y="275" width="890" height="90" rx="16" fill="#f3f7fb" stroke="#d5dce8"/>
    <text x="95" y="330" font-size="30" fill="#24466e">/api/produk</text>
    <text x="340" y="330" font-size="24" fill="#202631">mewakili kumpulan data produk UMKM</text>
  </g>
</svg>
