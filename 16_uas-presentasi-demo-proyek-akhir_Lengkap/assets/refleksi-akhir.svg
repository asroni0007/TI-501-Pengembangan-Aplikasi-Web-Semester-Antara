<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="56" font-family="Arial" font-size="34" font-weight="700" fill="#24466e" text-anchor="middle">Refleksi Akhir Pembelajaran</text>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="250" cy="260" r="95" fill="#eaf1fa" stroke="#24466e" stroke-width="4"/><text x="250" y="246" font-size="23" font-weight="700" fill="#24466e">Apa yang</text><text x="250" y="277" font-size="23" font-weight="700" fill="#24466e">dibangun?</text>
    <circle cx="550" cy="260" r="95" fill="#fff6d8" stroke="#fdbf0e" stroke-width="4"/><text x="550" y="246" font-size="23" font-weight="700" fill="#24466e">Apa yang</text><text x="550" y="277" font-size="23" font-weight="700" fill="#24466e">dipelajari?</text>
