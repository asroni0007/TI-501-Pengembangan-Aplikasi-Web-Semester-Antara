    <rect x="130" y="125" width="190" height="52" rx="12" fill="#24466e"/><text x="225" y="157" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">ROLE</text>
    <rect x="130" y="195" width="190" height="52" rx="12" fill="#0f7a48"/><text x="225" y="227" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">CONTEXT</text>
