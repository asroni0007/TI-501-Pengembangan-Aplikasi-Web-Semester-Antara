<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
  <rect width="1000" height="450" fill="#f3f7fb"/>
  <text x="500" y="42" font-family="Arial" font-size="28" font-weight="700" fill="#24466e" text-anchor="middle">Keamanan API Key</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="80" y="115" width="350" height="215" rx="18" fill="#fdebed" stroke="#a41d1f" stroke-width="3"/>
    <text x="255" y="155" font-size="24" font-weight="700" fill="#a41d1f">Jangan</text>
    <text x="255" y="205" font-size="18" fill="#202631">Menulis API key di frontend</text>
    <text x="255" y="240" font-size="18" fill="#202631">Commit file .env ke GitHub</text>
    <text x="255" y="275" font-size="18" fill="#202631">Mengirim key ke browser</text>
    <rect x="570" y="115" width="350" height="215" rx="18" fill="#edf8f2" stroke="#0f7a48" stroke-width="3"/>
    <text x="745" y="155" font-size="24" font-weight="700" fill="#0f7a48">Lakukan</text>
    <text x="745" y="205" font-size="18" fill="#202631">Simpan key di .env server</text>
    <text x="745" y="240" font-size="18" fill="#202631">Gunakan .env.example</text>
    <text x="745" y="275" font-size="18" fill="#202631">Validasi input sebelum panggil AI</text>
  </g>
  <text x="500" y="390" font-family="Arial" font-size="17" font-weight="700" fill="#24466e" text-anchor="middle">Prinsip: server menjadi perantara aman antara frontend dan provider AI.</text>
</svg>
